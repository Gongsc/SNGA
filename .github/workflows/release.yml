# 打 tag 就出包：Release 归档 → 签名 → 压缩 → 建一个 GitHub Release。
#
# 触发方式：
#   - 推送 1.9.0 / 1.9.0-beta1 这样的 tag（沿用仓库现有习惯，不带 v 前缀），带后缀的按预发布处理
#   - 手动 workflow_dispatch：只构建打包，产物留在这次运行的 artifact 里，不建 Release
#
# 可选的仓库 secret，一个都不配也能跑，那出来的就是临时签名（ad-hoc）的包：
#   MACOS_CERTIFICATE_P12       Developer ID Application 证书，.p12 的 base64（base64 -i cert.p12 | pbcopy）
#   MACOS_CERTIFICATE_PASSWORD  导出 .p12 时设的密码
#   MACOS_TEAM_ID               10 位团队 ID
#   APPLE_ID / APPLE_APP_PASSWORD  公证用的 Apple ID 和 App 专用密码；这两个也配齐了才会公证并装订
#
# 不跑测试：UI 测试偶发失败，卡在这儿只会挡住发布，要验证走各自的工作流。

name: 发布打包

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # 项目的部署目标是 macOS 26，需要带 macOS 26 SDK 的运行器；换镜像时这一行和下面的 Xcode 检查一起改。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::项目需要 Xcode 26 或更高版本，这台运行器上最新的是 $latest"
            exit 1
          fi

      - name: 确定版本号
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          project_version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' SNGA.xcodeproj/project.pbxproj | head -n 1)
          if [ -n "$TAG" ]; then
            # 1.9.0-beta1 这样的预发布 tag，比对时只看前面的数字部分
            if [ "${TAG%%-*}" != "$project_version" ]; then
              echo "::error::tag $TAG 和项目里的 MARKETING_VERSION $project_version 对不上，先在 Xcode 里改版本号再打 tag"
              exit 1
            fi
            version="$TAG"
            case "$TAG" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            version="$project_version"
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "base=$project_version"
            echo "prerelease=$prerelease"
            echo "zip=SNGA-$version-macOS.zip"
          } >> "$GITHUB_OUTPUT"
          echo "打包版本：$version"

      - name: 准备签名身份
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ] || [ -z "${CERTIFICATE_PASSWORD:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "::warning::没有配置 Developer ID 证书，改用临时签名（ad-hoc）打包，下载后首次打开需要手动放行"
            {
              echo "identity=-"
              echo "team="
              # ad-hoc 签名带不了安全时间戳，带了会直接失败
              echo "flags=--timestamp=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # 把临时钥匙串挂到搜索列表最前面，同时保留原有的，否则 xcodebuild 找不到证书
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          {
            echo "identity=Developer ID Application"
            echo "team=$TEAM_ID"
            echo "flags=--timestamp"
          } >> "$GITHUB_OUTPUT"

      - name: 归档 Release 构建
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM: ${{ steps.signing.outputs.team }}
          SIGN_FLAGS: ${{ steps.signing.outputs.flags }}
        run: |
          set -euo pipefail
          xcodebuild -project SNGA.xcodeproj \
            -scheme SNGA \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SNGA.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="$SIGN_FLAGS" \
            archive

      - name: 压缩产物
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SNGA.xcarchive/Products/Applications/SNGA.app"
          # 归档出来的 .app 已经带上了 App Sandbox、Hardened Runtime 和入口权限，这里只做校验，不重签
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/dist/$ZIP_NAME"

      - name: 公证并装订
        id: notarize
        if: steps.signing.outputs.identity != '-'
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "::warning::没有配置公证账号，产物只有 Developer ID 签名，首次打开仍会被 Gatekeeper 拦一次"
            exit 0
          fi
          app="$RUNNER_TEMP/SNGA.xcarchive/Products/Applications/SNGA.app"
          zip="$RUNNER_TEMP/dist/$ZIP_NAME"
          xcrun notarytool submit "$zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          # 票据装订在 .app 上，所以装订完要重新压一次
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: 上传运行产物
        uses: actions/upload-artifact@v4
        with:
          name: SNGA-${{ steps.version.outputs.version }}-macOS
          path: ${{ runner.temp }}/dist/${{ steps.version.outputs.zip }}
          if-no-files-found: error

      - name: 生成发布说明
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          # README 里每个版本都有一节「## 1.9.0 更新」，直接拿来当发布说明
          awk -v version="$BASE" '
            $0 ~ "^## \\[?" version " " { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' README.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::warning::README 里没找到 $BASE 的更新小节，发布说明留空"
          fi
          {
            echo
            echo "## 安装"
            echo
            echo "下载 zip，解压后把 \`SNGA.app\` 拖进「应用程序」。需要 macOS 26.0 或更高版本。"
            if [ "$NOTARIZED" = "true" ]; then
              echo
              echo "这个包已经过 Developer ID 签名和 Apple 公证，双击即可打开。"
            elif [ "$IDENTITY" != "-" ]; then
              echo
              echo "这个包有 Developer ID 签名但未公证，首次打开会被拦一次：在「系统设置 → 隐私与安全性」里点「仍要打开」。"
            else
              echo
              echo "这个包只有临时签名，未经 Apple 公证。首次打开会提示无法验证开发者，在「系统设置 → 隐私与安全性」里点「仍要打开」，或者执行："
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine /Applications/SNGA.app'
              echo '```'
            fi
          } >> "$notes"

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/dist/$ZIP_NAME"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重跑同一个 tag：覆盖资产和说明，不新建
            gh release upload "$TAG" "$zip" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            args=(--title "$TAG" --notes-file "$notes")
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh release create "$TAG" "$zip" "${args[@]}"
          fi
