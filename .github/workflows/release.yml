# 打 tag 就出包：Release 归档 → 临时签名 → 压缩 → 建一个 GitHub Release。
#
# 触发方式：
#   - 推送 1.9.0 / 1.9.0-beta1 这样的 tag（沿用仓库现有习惯，不带 v 前缀），带后缀的按预发布处理
#   - 手动 workflow_dispatch：只构建打包，产物留在这次运行的 artifact 里，不建 Release
#
# 签名一律是临时签名（ad-hoc），不需要任何 secret。本项目全局不用 macOS 钥匙串，而
# Developer ID 签名必须先把私钥导进钥匙串才能交给 codesign，所以这条路整个去掉了：
# 不导证书，也不公证。代价是用户首次打开要手动放行一次，发布说明里写了怎么做。
#
# 不跑测试：UI 测试偶发失败，卡在这儿只会挡住发布，要验证走各自的工作流。

name: 发布打包

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # 项目的部署目标是 macOS 26，需要带 macOS 26 SDK 的运行器；换镜像时这一行和下面的 Xcode 检查一起改。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::项目需要 Xcode 26 或更高版本，这台运行器上最新的是 $latest"
            exit 1
          fi

      - name: 确定版本号
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          project_version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' SNGA.xcodeproj/project.pbxproj | head -n 1)
          if [ -n "$TAG" ]; then
            # 1.9.0-beta1 这样的预发布 tag，比对时只看前面的数字部分
            if [ "${TAG%%-*}" != "$project_version" ]; then
              echo "::error::tag $TAG 和项目里的 MARKETING_VERSION $project_version 对不上，先在 Xcode 里改版本号再打 tag"
              exit 1
            fi
            version="$TAG"
            case "$TAG" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            version="$project_version"
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "base=$project_version"
            echo "prerelease=$prerelease"
            echo "zip=SNGA-$version-macOS.zip"
          } >> "$GITHUB_OUTPUT"
          echo "打包版本：$version"

      - name: 归档 Release 构建
        run: |
          set -euo pipefail
          # 一律临时签名（ad-hoc）：CODE_SIGN_IDENTITY 就是一个减号。
          # ad-hoc 签名带不了安全时间戳，带了会直接失败，所以显式关掉。
          xcodebuild -project SNGA.xcodeproj \
            -scheme SNGA \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SNGA.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            archive

      - name: 压缩产物
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SNGA.xcarchive/Products/Applications/SNGA.app"
          # 归档出来的 .app 已经带上了 App Sandbox、Hardened Runtime 和入口权限，这里只做校验，不重签
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/dist/$ZIP_NAME"

      - name: 上传运行产物
        uses: actions/upload-artifact@v4
        with:
          name: SNGA-${{ steps.version.outputs.version }}-macOS
          path: ${{ runner.temp }}/dist/${{ steps.version.outputs.zip }}
          if-no-files-found: error

      - name: 生成发布说明
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          # README 里每个版本都有一节「## 1.9.0 更新」，直接拿来当发布说明
          awk -v version="$BASE" '
            $0 ~ "^## \\[?" version " " { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' README.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::warning::README 里没找到 $BASE 的更新小节，发布说明留空"
          fi
          {
            echo
            echo "## 安装"
            echo
            echo "下载 zip，解压后把 \`SNGA.app\` 拖进「应用程序」。需要 macOS 26.0 或更高版本。"
            echo
            echo "这个包只有临时签名，未经 Apple 公证。首次打开会提示无法验证开发者，在「系统设置 → 隐私与安全性」里点「仍要打开」，或者执行："
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/SNGA.app'
            echo '```'
          } >> "$notes"

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/dist/$ZIP_NAME"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重跑同一个 tag：覆盖资产和说明，不新建
            gh release upload "$TAG" "$zip" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            args=(--title "$TAG" --notes-file "$notes")
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh release create "$TAG" "$zip" "${args[@]}"
          fi
