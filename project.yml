name: SNGA
options:
  bundleIdPrefix: cn.snga
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.6
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SNGA:
    type: application
    platform: macOS
    sources:
      - path: SNGA
    dependencies:
      - package: SwiftSoup
    entitlements:
      path: SNGA/SNGA.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.snga.client
        PRODUCT_NAME: SNGA
        MARKETING_VERSION: 1.9.2
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SNGA
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  SNGATests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SNGATests
    dependencies:
      - target: SNGA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.snga.client.tests
        GENERATE_INFOPLIST_FILE: YES
  SNGAUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SNGAUITests
    dependencies:
      - target: SNGA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.snga.client.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SNGA:
    build:
      targets:
        SNGA: all
        SNGATests: [test]
        SNGAUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: SNGATests
        - name: SNGAUITests
